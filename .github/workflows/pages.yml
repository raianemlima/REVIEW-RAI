name: Publicar site
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    # Só o main publica. Sem isto, "Run workflow" em outra branch (ou na branch padrão antiga) publicava uma versão antiga do app.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar a pasta do site (só o que é público)
        run: |
          mkdir _site
          cp CNAME index.html deck.enc app-src.txt conheca.html direitos-humanos-dpesp.html sw.js manifest.webmanifest privacidade.html termos.html _site/
          cp -r icons fonts screenshots arquivos _site/
          mkdir -p _site/docs
          cp docs/RELATORIO-MATERIAS-E-PESOS-DPE.md _site/docs/
      - name: Chaves dos PDFs protegidos no baralho (segredos APP_SENHA e CHAVE_ARQUIVOS)
        env:
          APP_SENHA: ${{ secrets.APP_SENHA }}
          CHAVE_ARQUIVOS: ${{ secrets.CHAVE_ARQUIVOS }}
        run: node ferramentas/ci/injetar_arquivos.mjs _site/index.html
      - name: Revisões de texto dos cartões (segredos APP_SENHA e REVISOES_CHAVE)
        env:
          APP_SENHA: ${{ secrets.APP_SENHA }}
          REVISOES_CHAVE: ${{ secrets.REVISOES_CHAVE }}
        run: node ferramentas/ci/aplicar_revisoes.mjs _site/index.html
      - name: Validar os arquivos obrigatórios do app e do cache offline
        run: node ferramentas/ci/validar_site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
