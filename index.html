<title>Review DPE</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: uma coluna de trabalho (máx. 760px) com abas no topo; a sessão ocupa a coluna como uma ficha de estudo. */
:root {
  --bg: #f3f5f2;          /* papel com leve verde */
  --surface: #ffffff;
  --ink: #17221d;
  --muted: #5b6862;
  --line: #d9dfda;
  --accent: #155e4a;      /* verde Defensoria, profundo */
  --accent-ink: #ffffff;
  --accent-soft: #e2eee8;
  --amber: #8a5a00;  --amber-soft: #f6ebd3;
  --ok: #1d6b3a;     --ok-soft: #e0f0e5;
  --bad: #a3271f;    --bad-soft: #f8e1de;
  --info: #2d4f86;   --info-soft: #e3eaf6;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #19201c; --ink: #e6ece8; --muted: #9aa8a1; --line: #2c3631;
  --accent: #5fbf9b; --accent-ink: #0d1a14; --accent-soft: #1d3129;
  --amber: #e2b45c; --amber-soft: #3a2f18; --ok: #6fcf8f; --ok-soft: #1a3324;
  --bad: #f08a80; --bad-soft: #3d1f1c; --info: #93b2e8; --info-soft: #1e2a3f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201c; --ink: #e6ece8; --muted: #9aa8a1; --line: #2c3631;
  --accent: #5fbf9b; --accent-ink: #0d1a14; --accent-soft: #1d3129;
  --amber: #e2b45c; --amber-soft: #3a2f18; --ok: #6fcf8f; --ok-soft: #1a3324;
  --bad: #f08a80; --bad-soft: #3d1f1c; --info: #93b2e8; --info-soft: #1e2a3f; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-read); font-weight: 600; font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
.brand h1 span { color: var(--accent); }
.save { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; }
nav.tabs button { font: 500 0.88rem var(--f-ui); background: none; border: 0; color: var(--muted); padding: 8px 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

h2 { font-family: var(--f-read); font-weight: 500; font-size: 1.6rem; line-height: 1.2; margin: 24px 0 4px; text-wrap: balance; }
h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 28px 0 10px; }
p { margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.btn { font: 600 0.92rem var(--f-ui); border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 6px 10px; font-size: 0.82rem; font-weight: 500; }
.btn.ghost { background: none; }
.btn:disabled { opacity: 0.5; cursor: default; }

/* Hoje */
.plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin: 16px 0; }
.plan > div { padding: 14px 16px; border-left: 1px solid var(--line); min-width: 0; }
.plan > div:first-child { border-left: 0; }
.plan .n { font-family: var(--f-mono); font-size: 1.7rem; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.plan .l { color: var(--muted); font-size: 0.82rem; }
.go { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.note { border-radius: 8px; padding: 10px 12px; font-size: 0.88rem; background: var(--info-soft); color: var(--ink); margin: 12px 0; }
.note.warn { background: var(--amber-soft); }
.temas { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.temas th { text-align: left; font-weight: 500; color: var(--muted); font-size: 0.78rem; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
.temas td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.temas td.num, .temas th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.dots { letter-spacing: 1px; color: var(--accent); font-family: var(--f-mono); }
.dots b { color: var(--line); font-weight: 400; }
.scroll-x { overflow-x: auto; }

/* Sessão */
.progress { display: flex; align-items: center; gap: 12px; margin: 18px 0 10px; font-size: 0.82rem; color: var(--muted); }
.progress .track { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress .track i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.chip { font: 500 0.72rem var(--f-ui); letter-spacing: 0.02em; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.t-pegadinha { background: var(--amber-soft); color: var(--amber); }
.chip.t-jurisprudencia { background: var(--info-soft); color: var(--info); }
.chip.t-multipla_escolha { background: var(--info-soft); color: var(--info); }
.chip.caiu { background: var(--bad-soft); color: var(--bad); }
.chip.plain { background: none; color: var(--muted); padding-inline: 0; }
.front { font-family: var(--f-read); font-size: 1.28rem; line-height: 1.45; margin: 0; white-space: pre-line; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--accent); margin-inline: 2px; }
.opts { display: grid; gap: 8px; margin-top: 16px; }
.opt { text-align: left; font: 400 1rem/1.4 var(--f-read); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; color: var(--ink); display: flex; gap: 10px; }
.opt .k { font: 500 0.82rem var(--f-mono); color: var(--muted); padding-top: 2px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.ce { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.ce .btn { min-width: 120px; }
.fill { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.fill input { flex: 1 1 220px; min-width: 0; font: 1rem var(--f-read); padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.back { border-top: 1px dashed var(--line); margin-top: 18px; padding-top: 16px; }
.verdict { font: 600 0.82rem var(--f-ui); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.verdict.ok { color: var(--ok); } .verdict.no { color: var(--bad); }
.answer { font-family: var(--f-read); font-size: 1.15rem; line-height: 1.45; margin: 0 0 10px; white-space: pre-line; }
.why { color: var(--muted); font-size: 0.92rem; margin: 0 0 10px; white-space: pre-line; }
.src { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); margin: 0; }
.src .sec { color: var(--amber); }
.yours { font-size: 0.88rem; color: var(--muted); margin-bottom: 8px; }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.rate button { font: 600 0.9rem var(--f-ui); border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 6px 8px; cursor: pointer; display: grid; gap: 2px; }
.rate button small { font: 400 0.72rem var(--f-mono); color: var(--muted); }
.rate button.g1 { border-color: var(--bad); } .rate button.g1:hover { background: var(--bad-soft); }
.rate button.g3 { border-color: var(--accent); } .rate button.g3:hover { background: var(--accent-soft); }
.rate button.sugg { box-shadow: 0 0 0 2px var(--accent); }
.rate button.g1.sugg { box-shadow: 0 0 0 2px var(--bad); }
.keys { font-size: 0.74rem; color: var(--muted); margin-top: 12px; text-align: center; }
.keys kbd { font: 0.72rem var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.tools { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.flagbox { margin-top: 12px; display: grid; gap: 8px; }
textarea { width: 100%; min-height: 70px; font: 0.92rem var(--f-ui); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
.done { text-align: center; padding: 32px 16px; }
.done .big { font-family: var(--f-read); font-size: 2rem; }

/* Biblioteca */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.filters input, .filters select { font: 0.9rem var(--f-ui); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.filters input { flex: 1 1 220px; }
.lib { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.lib li { border-bottom: 1px solid var(--line); }
.lib details summary { list-style: none; cursor: pointer; padding: 10px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.lib details summary::-webkit-details-marker { display: none; }
.lib .q { font-family: var(--f-read); font-size: 1rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lib .st { font: 0.72rem var(--f-mono); color: var(--muted); text-align: right; white-space: nowrap; }
.lib .st .flag { color: var(--bad); }
.lib .body { padding: 0 0 14px; display: grid; gap: 6px; }
.lib .body .front { font-size: 1.02rem; }
.lib .body .answer { font-size: 1rem; }
.count { font-size: 0.82rem; color: var(--muted); }

/* Estatísticas */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.kpis > div { padding: 12px 14px; border-left: 1px solid var(--line); min-width: 0; }
.kpis > div:first-child { border-left: 0; }
.kpis .n { font: 500 1.35rem var(--f-mono); font-variant-numeric: tabular-nums; }
.kpis .l { font-size: 0.78rem; color: var(--muted); }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font: 10px var(--f-mono); }
.chart .grid { stroke: var(--line); }
.chart .b { fill: var(--accent); }
.chart .b2 { fill: var(--bad); }
.legend { display: flex; gap: 14px; font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* Ajustes */
.form { display: grid; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 600; font-size: 0.9rem; }
.field .hint { font-size: 0.82rem; color: var(--muted); }
.field input, .field select { font: 0.95rem var(--f-ui); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); max-width: 280px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm { background: var(--amber-soft); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }

@media (max-width: 520px) {
  .plan, .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .plan > div:nth-child(3), .kpis > div:nth-child(3) { border-left: 0; }
  .plan > div:nth-child(n+3), .kpis > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .card { padding: 18px 16px 14px; }
  .front { font-size: 1.15rem; }
  .rate { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .keys { display: none; }
  nav.tabs button { padding: 8px 8px 10px; font-size: 0.84rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== v2: visual motivacional ===== */
.hero { background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #0b1f17)); color: var(--accent-ink); border-radius: 20px; padding: 18px 18px 16px; margin: 16px 0 14px; box-shadow: 0 8px 24px -12px color-mix(in srgb, var(--accent) 70%, transparent); }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hero .hi { font: 500 .92rem var(--f-ui); opacity: .92; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 .78rem var(--f-ui); background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 10px; }
.hero-main { display: flex; align-items: center; gap: 16px; margin: 14px 0 6px; }
.ringbox { position: relative; width: 96px; height: 96px; flex: none; }
.ringbox svg { width: 100%; height: 100%; transform: rotate(-90deg); }

.cta { width: 100%; margin-top: 14px; font: 700 1.05rem var(--f-ui); border: 0; border-radius: 14px; padding: 15px 16px; background: var(--accent-ink); color: var(--accent); cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.18); transition: transform .08s, box-shadow .08s; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 0 0 6px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.tile .n { font: 600 1.35rem var(--f-mono); line-height: 1.1; } .tile .l { font-size: .74rem; color: var(--muted); }

.dcards { display: grid; gap: 8px; }
.dcard { text-align: left; font: inherit; color: inherit; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; display: grid; gap: 8px; }
.dcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.bar i.lo { background: var(--bad); } .bar i.mid { background: #d49a1a; } .bar i.hi { background: var(--ok); }

/* sessão */
.progress .track { height: 10px; border-radius: 6px; } .progress .track i { border-radius: 6px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #6fcf8f)); transition: width .4s cubic-bezier(.2,.8,.2,1); }
.card { border-radius: 20px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.35); }
.card.enter { animation: enter .28s cubic-bezier(.2,.8,.2,1); }
.back { animation: rise .25s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateX(18px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.front { font-size: 1.4rem; }
.recall { color: var(--muted); font-size: .84rem; margin: 18px 0 0; display: flex; gap: 6px; align-items: center; }
.ce .btn.primary { width: 100%; padding: 15px; font-size: 1.02rem; border-radius: 14px; }
.ce [data-ce] { flex: 1; padding: 15px; font-size: 1.02rem; border-radius: 14px; }
.opt { padding: 13px 14px; border-radius: 12px; }
.rate button { padding: 13px 6px 10px; border-radius: 14px; border-width: 1.5px; }
.rate button.g2 { border-color: var(--amber); } .rate button.g2:hover { background: var(--amber-soft); }
.rate button.g4 { border-color: var(--info); } .rate button.g4:hover { background: var(--info-soft); }
.rate button:active { transform: scale(.97); }
.verdict.ok::before { content: "✓ "; } .verdict.no::before { content: "✕ "; }
.verdict { font-size: .9rem; }
.done { position: relative; overflow: hidden; }
.done .ringbox { margin: 0 auto 12px; width: 120px; height: 120px; color: var(--accent); }
.done .ringbox .tr { stroke: var(--line); }
.done .stats3 { display: flex; justify-content: center; gap: 22px; margin: 14px 0 6px; flex-wrap: wrap; }
.done .stats3 b { display: block; font: 600 1.4rem var(--f-mono); } .done .stats3 span { font-size: .78rem; color: var(--muted); }
.conf { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.conf i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; opacity: 0; animation: fall 2.4s ease-in forwards; }
@keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 0; transform: translateY(420px) rotate(540deg); } }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .88rem; z-index: 30; animation: rise .25s; }

/* estatísticas: constância */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--line); }

.heat i.l3 { background: color-mix(in srgb, var(--accent) 80%, var(--line)); } .heat i.l4 { background: var(--accent); } .heat i.fut { background: none; }

@media (max-width: 720px) {
  .top-in { padding-block: 10px 10px; }
  .brand h1 { font-size: 1.15rem; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; overflow: visible; }
  nav.tabs button, nav.tabs button[aria-selected="true"] { flex: 1; display: grid; justify-items: center; gap: 2px; border: 0; border-radius: 12px; padding: 6px 2px; font-size: .68rem; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

}
@media (min-width: 721px) { nav.tabs .ic { display: none; } }
@media (max-width: 520px) { .hero h2 { font-size: 1.3rem; } .tiles .n { font-size: 1.15rem; } .front { font-size: 1.22rem; } }
@media (prefers-reduced-motion: reduce) { .conf { display: none; } .card.enter, .back, .toast { animation: none; } }

/* ===== v3: fênix, painéis, modos, conquistas ===== */
body { background: radial-gradient(1100px 420px at 85% -80px, color-mix(in srgb, var(--accent) 14%, transparent), transparent), radial-gradient(800px 380px at -10% 18%, color-mix(in srgb, #ff9a2e 9%, transparent), transparent), var(--bg); background-attachment: fixed; }

.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.xp { margin-top: 10px; } .xp-top { display: flex; justify-content: space-between; font-size: .8rem; opacity: .95; margin-bottom: 4px; }

.xpbar.goal i { background: var(--accent-ink); }
.xpbar.light { background: var(--line); } .xpbar.light i { background: linear-gradient(90deg, #ffc933, #ff8a1a); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin: 14px 0; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; } .ph h3 { margin: 0; }
.badge { font: 600 .72rem var(--f-mono); color: var(--amber); background: var(--amber-soft); border-radius: 999px; padding: 2px 8px; white-space: nowrap; } .badge.zero { color: var(--ok); background: var(--ok-soft); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.wd i { display: grid; place-items: center; aspect-ratio: 1; max-width: 46px; margin: 0 auto 4px; border-radius: 50%; background: var(--line); font-style: normal; font-size: 1.1rem; }

.weak { display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); } .weak:first-of-type { border-top: 0; }
.weak .wi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 1.1rem; }

.fases { display: flex; gap: 4px; } .fase { flex: 1; text-align: center; font-size: .66rem; color: var(--muted); }
.fase i { display: block; height: 8px; border-radius: 4px; background: var(--line); margin-bottom: 4px; }
.fase.past i { background: color-mix(in srgb, var(--accent) 40%, var(--line)); } .fase.now i { background: var(--accent); } .fase.now { color: var(--ink); font-weight: 700; }
.mynote { background: var(--amber-soft); border-radius: 10px; padding: 8px 10px; font-size: .9rem; margin: 0 0 10px; }
mark.hl { background: color-mix(in srgb, #ffd54a 55%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.swipehint { text-align: center; color: var(--muted); font-size: .72rem; margin: 10px 0 0; display: none; }
@media (hover: none) { .swipehint { display: block; } }
.card { touch-action: pan-y; } .card[data-sw="r"] { outline: 3px solid var(--ok); } .card[data-sw="l"] { outline: 3px solid var(--bad); }

.done .onb-art { margin: 6px auto 4px; width: fit-content; }

.dotsx { display: flex; gap: 6px; justify-content: center; margin: 16px 0; } .dotsx i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); } .dotsx i.on { background: var(--accent); width: 22px; border-radius: 4px; }
@media (max-width: 520px) { .conqs { grid-template-columns: repeat(2, minmax(0,1fr)); } .modos { gap: 8px; } }
@media (prefers-reduced-motion: reduce) { .mascot { animation: none; } .card.flip { animation: none; } }

.concepts { margin: 4px 0 12px; display: grid; gap: 6px; }

nav.tabs button { position: relative; }

.qa { margin: 0 0 10px; font-size: .9rem; } .qa.ok b { color: var(--ok); } .qa.no b { color: var(--bad); }

.iconbtn { background: none; border: 1px solid var(--line); border-radius: 10px; width: 34px; height: 34px; cursor: pointer; font-size: 1rem; line-height: 1; }

.eb-entrar { width: 100%; margin: 0 0 8px; }

.eb-texto { font-family: var(--f-read); line-height: 1.65; color: var(--ink); overflow-wrap: anywhere; }

.eb-texto h3, .eb-texto h4, .eb-texto h5, .eb-texto h6 { text-transform: none; letter-spacing: 0; color: var(--ink); font-family: var(--f-ui); line-height: 1.3; scroll-margin-top: 70px; }
.eb-texto h3 { font-size: 1.2em; margin: 30px 0 10px; } .eb-texto h4 { font-size: 1.06em; margin: 24px 0 8px; } .eb-texto h5 { font-size: .98em; margin: 18px 0 6px; color: var(--accent); } .eb-texto h6 { font-size: .92em; margin: 14px 0 6px; color: var(--muted); }
.eb-texto p { margin: 0 0 12px; } .eb-texto ul, .eb-texto ol { padding-left: 22px; margin: 0 0 12px; } .eb-texto li { margin: 4px 0; }
.eb-texto blockquote { margin: 14px 0; padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 12px 12px 0; font-size: .95em; }
.eb-texto hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; } .eb-texto .scroll-x { margin: 0 0 14px; } table.eb-tab { font-family: var(--f-ui); min-width: 560px; } table.eb-tab th, table.eb-tab td { overflow-wrap: normal; word-break: normal; hyphens: auto; }
.eb-lido { display: flex; gap: 8px; align-items: center; margin: 18px 0 10px; font-weight: 600; } .eb-nav { justify-content: space-between; }
.errbar { background: var(--amber-soft); border-radius: 14px; padding: 10px 12px; margin: 8px 0 -4px; display: grid; gap: 8px; font-size: .88rem; animation: rise .25s; }
.errbar > div { display: flex; gap: 6px; flex-wrap: wrap; } .errbar button { font: 500 .8rem var(--f-ui); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 10px; cursor: pointer; } .errbar .x { margin-left: auto; }

html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body { overscroll-behavior-y: none; }

<script>
/* baralho criptografado: ver gate */
// Motor de revisão: FSRS-4.5 com parâmetros padrão + prioridade por incidência
let W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
const W0 = W.slice();
const DECAY = -0.5, FACTOR = 19 / 81;
const clampD = d => Math.min(10, Math.max(1, d));

function retrievability(t, s) { return Math.pow(1 + FACTOR * t / s, DECAY); }
function intervalFor(s, retention) { return s / FACTOR * (Math.pow(retention, 1 / DECAY) - 1); }
function initD(g) { return clampD(W[4] - (g - 3) * W[5]); }
function nextD(d, g) { const d1 = d - W[6] * (g - 3); return clampD(W[7] * W[4] + (1 - W[7]) * d1); }
function recallS(d, s, r, g) {
  const hard = g === 2 ? W[15] : 1, easy = g === 4 ? W[16] : 1;
  return s * (Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) * hard * easy + 1);
}
function forgetS(d, s, r) {
  return Math.min(s, W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - r)));
}

// estado do cartão: {s, d, due, last, reps, lapses, f (dia da 1ª revisão)}; ausente = novo
// opts: {retention, maxDays}
function schedule(st, g, today, opts) {
  const retention = opts.retention || 0.9;
  let s, d, reps, lapses, f;
  if (!st) {
    s = W[g - 1]; d = initD(g); reps = 1; lapses = g === 1 ? 1 : 0; f = today;
  } else {
    const t = Math.max(0, today - st.last);
    const r = retrievability(t, st.s);
    d = nextD(st.d, g);
    s = g === 1 ? forgetS(st.d, st.s, r) : recallS(st.d, st.s, r, g);
    reps = st.reps + 1; lapses = st.lapses + (g === 1 ? 1 : 0); f = st.f;
  }
  let ivl = Math.round(intervalFor(s, retention));
  const cap = Math.max(1, Math.min(opts.maxDays || 365, 365));
  ivl = Math.min(Math.max(1, ivl), cap);
  const out = { s: +s.toFixed(4), d: +d.toFixed(4), due: today + ivl, last: today, reps, lapses, f };
  if (st && st.x) out.x = st.x;
  return out;
}

// prioridade = peso do cartão × peso da disciplina × urgência × risco de esquecer
function urgency(daysToExam) {
  if (daysToExam == null || daysToExam < 0) return 1;
  return 1 + Math.min(1, Math.max(0, (180 - daysToExam) / 180));
}
function priority(card, st, today, ctx) {
  const risco = st ? 1 - retrievability(Math.max(0, today - st.last), st.s) : 1;
  // incidência em provas de Defensoria pesa mais que o peso didático do cartão
  return ((0.4 * card.peso + 0.6 * (card.inc || card.peso)) / 5) * (ctx.pesoDisciplina || 1) * urgency(ctx.daysToExam) * Math.max(0.01, risco);
}

if (typeof module !== 'undefined') module.exports = { W, retrievability, intervalFor, schedule, priority, urgency };

</script>

  function checarSenha(a, b) {

  async function verificar(email, codigo, tipos) {

  // ---- telas ----
  const st = { tela: "entrar", email: "", msg: "", ok: false };
  const inp = "min-height:44px;padding:12px;font:16px var(--f-ui);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box";

  const lnk = "min-height:44px;display:flex;align-items:center;padding:6px 0;font:500 15px var(--f-ui);border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;text-align:left";
  const campoEmail = () => `<label for="gEmail" style="display:grid;gap:5px;color:var(--muted);font-size:14px;font-weight:500">E-mail<input id="gEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="nome@exemplo.com" value="${esc(st.email)}" required aria-describedby="gmsg" style="${inp}"></label>`;
  const campoSenha = (id, ph, auto) => { const nome = id === "gSenha2" ? "senha de confirmação" : /Nova senha/.test(ph) ? "nova senha" : "senha"; return `<div style="display:grid;gap:5px"><label for="${id}" style="color:var(--muted);font-size:14px;font-weight:500">${esc(ph)}</label><div style="display:flex;gap:6px"><input id="${id}" type="password" autocomplete="${auto}" placeholder="${esc(ph)}" required aria-describedby="gmsg" style="${inp};flex:1;min-width:0"><button type="button" data-ver="${id}" data-nome="${nome}" aria-controls="${id}" aria-pressed="false" aria-label="Mostrar ${nome}" style="${btn2}">Mostrar</button></div></div>`; };
  const campoCod = () => `<label for="gCod" style="display:grid;gap:5px;color:var(--muted);font-size:14px">Código enviado para <b>${esc(st.email)}</b><input id="gCod" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="000000" required aria-describedby="gmsg" style="${inp};letter-spacing:.2em;font-size:20px"></label>`;
  const ir = (t, txt) => `<button type="button" data-ir="${t}" style="${lnk}">${txt}</button>`;
  const naoChegou = `<p style="margin:0;color:var(--muted);font-size:14px">Não chegou? Veja a caixa de spam e as promoções. O código vale por 1 hora.</p>`;
  const TITULOS = { entrar: "Acesse sua conta", criar: "Crie sua conta", confirmar: "Confirme seu e-mail", esqueci: "Recuperar acesso", esqueci2: "Defina uma nova senha", codigo: "Entrar sem senha", codigo2: "Confirme o código", novaSenha: "Atualize sua senha", aguardando: "Acesso pendente" };
  const TELAS = {
    entrar: () => [`Entre na sua conta.`, `${campoEmail()}${campoSenha("gSenha", "Senha", "current-password")}<button id="gOk" style="${btn}">Entrar</button>`,
      ir("criar", "Criar conta") + ir("esqueci", "Esqueci minha senha")],
    criar: () => [`Crie a sua conta com o <b>e-mail liberado na compra</b> e uma senha de pelo menos 8 caracteres.`, `${campoEmail()}${campoSenha("gSenha", "Senha", "new-password")}${campoSenha("gSenha2", "Repita a senha", "new-password")}<p style="margin:0;color:var(--muted);font-size:14px">Ao criar a conta, você concorda com os <a href="termos.html" target="_blank" rel="noopener" style="color:var(--accent)">Termos de Uso</a> e a <a href="privacidade.html" target="_blank" rel="noopener" style="color:var(--accent)">Política de Privacidade</a>.</p><button id="gOk" style="${btn}">Criar conta</button>`, ir("entrar", "Já tenho conta") + `<p style="margin:10px 0 0;text-align:center;font-size:14px;color:var(--muted)">Ainda não assinou? <a href="conheca.html#preco" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">Ver planos</a> · mensal R$ 15,99 ou anual em 12x de R$ 11,20</p>`],
    confirmar: () => [`Falta só <b>confirmar o seu e-mail</b> com o código que enviamos.`, `${campoCod()}<button id="gOk" style="${btn}">Confirmar e entrar</button><button type="button" id="gReenviar" style="${btn2}">Enviar outro código</button>${naoChegou}<p style="margin:0;color:var(--muted);font-size:14px">Se você já tinha conta com esse e-mail, volte e use Entrar ou Esqueci minha senha.</p>`, ir("entrar", "Voltar")],
    esqueci: () => [`Digite o seu e-mail. Enviamos um código para você criar uma senha nova.`, `${campoEmail()}<button id="gOk" style="${btn}">Enviar código</button>`, ir("entrar", "Voltar")],
    esqueci2: () => [`Crie a sua senha nova.`, `${campoCod()}${campoSenha("gSenha", "Nova senha (mínimo 8 caracteres)", "new-password")}${campoSenha("gSenha2", "Repita a nova senha", "new-password")}<button id="gOk" style="${btn}">Salvar senha e entrar</button><button type="button" id="gReenviar" style="${btn2}">Enviar outro código</button>${naoChegou}`, ir("entrar", "Voltar")],

    novaSenha: () => [`Você entrou pelo link do e-mail. Agora crie a sua senha nova.`, `${campoSenha("gSenha", "Nova senha (mínimo 8 caracteres)", "new-password")}${campoSenha("gSenha2", "Repita a nova senha", "new-password")}<button id="gOk" style="${btn}">Salvar senha e entrar</button>`, ""],
    aguardando: () => [`Olá, <b>${esc(st.email)}</b>. Sua conta está criada, mas o acesso ao conteúdo <b>ainda não foi liberado</b>. Se você já comprou, aguarde a liberação ou fale com o suporte. Ainda não assinou? Mensal de <b>R$ 15,99</b> ou anual em <b>12x de R$ 11,20</b>.`, `<button id="gOk" style="${btn}">Verificar de novo</button><a href="conheca.html?plano=anual#preco" target="_blank" rel="noopener" style="${btn2};display:block;text-align:center;text-decoration:none;box-sizing:border-box">Ver planos e assinar</a><button type="button" id="gSair" style="${btn2}">Sair desta conta</button>`, ""]

    f.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => { const i = $("#" + b.dataset.ver), v = i.type === "password"; i.type = v ? "text" : "password"; b.textContent = v ? "Ocultar" : "Mostrar"; b.setAttribute("aria-pressed", String(v)); b.setAttribute("aria-label", (v ? "Ocultar " : "Mostrar ") + b.dataset.nome); });

  async function rodar(b, txt, fn) {

  const val = id => ($(id) || {}).value || "";
  const pegaEmail = () => (st.email = normEmail(val("#gEmail")));

    entrar: async () => {

    criar: async () => {

      try { j = await sb("/auth/v1/signup?redirect_to=" + volta(), { email, password: val("#gSenha") }); }

    esqueci: async () => { await sb("/auth/v1/recover?redirect_to=" + volta(), { email: pegaEmail() }); tela("esqueci2", "Se houver uma conta com esse e-mail, o código chega em instantes.", true); },

  function visitanteNovo(c) {

      if (navigator.onLine === false) return false;

      return true;
    } catch (_) { return false; }
  }

  // ---- início ----
  (async () => {
    // link do e-mail (confirmação ou recuperação): o Supabase volta com a sessão no #hash
    const h = new URLSearchParams(location.hash.slice(1)); let tipoLink = null;
    if (h.get("access_token") || h.get("error_description")) {
      try { history.replaceState(null, "", location.pathname + location.search); } catch (_) {}
      if (h.get("access_token")) {
        try { const u = await sb("/auth/v1/user", null, h.get("access_token")); gravarConta(sessao({ user: u, access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_at: +h.get("expires_at") || 0, expires_in: +h.get("expires_in") || 3600 })); tipoLink = h.get("type"); }
        catch (_) { st.msg = "Não consegui confirmar o link. Entre com e-mail e senha."; }
      } else st.msg = "Esse link expirou ou já foi usado. Entre ou peça um código novo.";
    }
    if (tipoLink === "recovery") return tela("novaSenha");
    // chave guardada e assinatura confirmada há menos de PRAZO: abre na hora (também offline) e confere a assinatura em segundo plano
    const verif = verificadoEm(), recente = verif > 0 && Date.now() - verif < PRAZO;
    try {
      const raw = localStorage.getItem(KEY);
      const c = lerConta(), chaveDaConta = !!(raw && c && c.uid && localStorage.getItem(KEY_UID) === c.uid);
      if (raw && recente && chaveDaConta) {
        let enc;
        try { enc = await carregarDeck(); }
        catch (e) { st.msg = msgDecifrar(e) || "Não consegui carregar o conteúdo offline. Conecte-se e tente novamente."; }
        if (enc) {
          let deck = null;
          try { const key = await crypto.subtle.importKey("raw", unb64(raw), "AES-GCM", false, ["decrypt"]); deck = await tryKey(key, enc); }
          catch (_) { esquecerChave(); }   // versão nova do app: a chave muda e a conta busca a nova
          if (deck !== null) {
            try { await start(deck); revalidar(); return; }
            catch (e) { st.msg = msgDecifrar(e) || "Não consegui iniciar o app. Atualize a página e tente de novo."; }
          }
        }
      }
    } catch (_) { esquecerChave(); }
    const c = lerConta();
    if (c && c.email) st.email = c.email;
    if (c && c.at) {
      try { if (await abrirComConta()) return; st.msg = "Sua sessão expirou. Entre de novo."; }
      catch (e) { st.msg = e.rede && verif ? "Conecte-se à internet para confirmar a sua assinatura. O app pede isso a cada 7 dias." : msgDecifrar(e) || e.message; }
    }
    else if (c && c.expirada) st.msg = "Sua sessão expirou. Entre de novo.";
    // quem chega pela primeira vez pelo navegador (link da bio, busca, indicação) vê antes a página de divulgação
    if (visitanteNovo(c)) { location.replace("conheca.html" + location.search); return; }
    tela("entrar");
  })();
})();</script>
